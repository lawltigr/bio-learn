<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bio-learn.css">
    <title>Document</title>
</head>
<body>
    <header>
        <a href="bio-learn.html" class="btn">Main page</a>
        <h1>BioLearn Dasboard</h1>
    </header>
    <main class="dashboard">
        <div class="dashboard-grid">
            <div class="dash-card" id="totalTests">Tests: 0</div>
            <div class="dash-card" id="avgScore">Average: 0%</div>
            <div class="dash-card" id="bestScore">Best: 0%</div>
            <div class="dash-card" id="achievementsCount">Achievements: 0</div>
        </div>
        <div class="rank-card">
            <h2 id="rank">Rank: Beginner</h2>
        </div>
        <section class="progress-section">
            <div class="section-header">
                <div>
                    <h2>Exam Performance</h2>
                    <p>Your results across exam attempts</p>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="examProgressChart"></canvas>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
