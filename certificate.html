<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bio-learn.css">
    <link rel="stylesheet" href="css/certificate.css">
    <title>Document</title>
</head>
<body>
    <main class="certificate">
        <div class="logo">
            BIOLEARN
        </div>
        <h1 class="title">Certificate of Completion</h1>
        <p class="subtitle">This certificates that the student completed</p>
        <h2>BioLearn Exam Mode</h2>
        <div class="student-name" id="studentName">John Smith</div>
        <p class="completed">for successfully completing</p>
        <div class="exam-name" id="examName"></div>
        <p class="description">for successfully completing the Biology Final Exam</p>
        <div class="info-grid">
            <div class="info-card">
                <span class="label">Score</span>
                <span class="value" id="score">48/50</span>
            </div>
            <div class="info-card">
                <span class="label">Result</span>
                <span class="value" id="percent">96%</span>
            </div>
            <div class="info-card">
                <span class="label">Grade</span>
                <span class="value" id="grade">A</span>
            </div>
        </div>
        <div class="certificate-footer">
            <div class="certificate-info">
                <p><strong>Certificate #</strong></p>
                <p id="certificateNumber"></p>
                <br>
                <p><strong>Issued</strong></p>
                <p id="certificateDate"></p>
            </div>
            <div class="seal">
                BIO<br>
                LEARN
            </div>
        </div>
        <div class="signatures">
            <div class="signature">
                <div class="line"></div>
                <span>Instructor</span>
            </div>
            <div class="signature">
                <div class="line">
                    <span>Director</span>
                </div>
            </div>
        </div>
    </main>
    <div class="actions">
        <button id="downloadBtn">Download PDF</button>
        <button onclick="window.print()">Print</button>
        <button onclick="history.back()">Back</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="js/certificate.js"></script>
</body>
</html>
