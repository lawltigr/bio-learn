<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <title>Document</title>
</head>
<body>
    <div class="welcome-card">
        <h1>BioLearn</h1>
        <p class="subtitle">Welcome to Biology Learning Platform</p>
        <div class="role-buttons">
            <button id="studentBtn" class="role-btn active">
                Student
            </button>
            <button id="adminBtn" class="role-btn">
                Administrator
            </button>
        </div>
    </div>
    <section id="studentModal" class="form-section">
        <h2>Student Information</h2>
        <input id="firstName" placeholder="First name">
        <input id="lastName" placeholder="Last name">
        <input id="group" placeholder="Group (optional)">
        <button id="startLearning" class="primary-btn">
            Start Learning
        </button>
    </section>
    
    <section id="adminModal" class="form-section hidden">
        <h2>Administrator</h2>
        <input id="adminPassword"  type="password" placeholder="Password">
        <button id="adminLogin" class="primary-btn">
            Login
        </button>
    </section>
    <script src="js/index.js"></script>
</body>
</html>
